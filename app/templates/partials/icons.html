{% macro icon(name, class_name="icon") -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "bolt" -%}
    <path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13V2Z"/>
  {%- elif name == "power" -%}
    <path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>
  {%- elif name == "battery" -%}
    <rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4"/><path d="M6 10v4"/><path d="M10 10v4"/>
  {%- elif name == "wifi" -%}
    <path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><path d="M12 19.5h.01"/>
  {%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
  {%- elif name == "sparkles" -%}
    <path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1L6.5 8.5l4.1-1.4L12 3Z"/>
    <path d="m18.5 14 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/>
  {%- elif name == "activity" -%}
    <path d="M3 12h4l2.5-7 5 14 2.5-7h4"/>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == "chevron" -%}
    <path d="m6 9 6 6 6-6"/>
  {%- elif name == "volume" -%}
    <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/>
  {%- elif name == "shield" -%}
    <path d="M12 3 4.5 6v5.5c0 4.5 3 7.7 7.5 9.5 4.5-1.8 7.5-5 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == "plug" -%}
    <path d="M9 3v5"/><path d="M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8Z"/><path d="M12 17v4"/>
  {%- elif name == "book" -%}
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
  {%- elif name == "server" -%}
    <rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>
    <path d="M7 7h.01"/><path d="M7 17h.01"/>
  {%- elif name == "gauge" -%}
    <path d="M4 14a8 8 0 1 1 16 0"/><path d="m12 14 4-4"/><path d="M4 14h2"/><path d="M18 14h2"/>
  {%- elif name == "plus" -%}
    <path d="M12 5v14"/><path d="M5 12h14"/>
  {%- elif name == "camera" -%}
    <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/>
  {%- elif name == "camera-off" -%}
    <path d="M3 3l18 18"/><path d="M10.6 6h4.9L17 8h3a1 1 0 0 1 1 1v7.5"/><path d="M6 8H4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h13"/><path d="M9.9 9.9a3.4 3.4 0 0 0 4.2 4.2"/>
  {%- elif name == "flashlight" -%}
    <path d="M9 2h6l-1.2 6.2L16 11v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-9l2.2-2.8L9 2Z"/><path d="M8 14h8"/>
  {%- elif name == "switch-camera" -%}
    <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3"/>
    <path d="m15.5 18.5-2-2"/><path d="m8.5 7.5 2-2"/>
  {%- elif name == "qr" -%}
    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M20 14v2"/><path d="M14 20h2"/><path d="M20 20h.01"/><path d="M20 17h.01"/>
  {%- elif name == "check" -%}
    <path d="m5 12 4.5 4.5L19 6.5"/>
  {%- elif name == "alert" -%}
    <path d="M12 3 2.8 19a1.2 1.2 0 0 0 1 1.8h16.4a1.2 1.2 0 0 0 1-1.8L12 3Z"/><path d="M12 9v4.5"/><path d="M12 17h.01"/>
  {%- elif name == "x" -%}
    <path d="M6 6l12 12"/><path d="M18 6 6 18"/>
  {%- elif name == "logout" -%}
    <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="m10 8-4 4 4 4"/><path d="M6 12h10"/>
  {%- elif name == "user" -%}
    <circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
  {%- elif name == "lock" -%}
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/>
  {%- elif name == "arrow-left" -%}
    <path d="M20 12H4"/><path d="m10 6-6 6 6 6"/>
  {%- elif name == "refresh" -%}
    <path d="M20 11a8 8 0 0 0-14.3-4.7L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.7L20 16"/><path d="M20 20v-4h-4"/>

    <path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9Z"/><path d="M9 21v-7h6v7"/>
  {%- elif name == "calendar" -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/>
  {%- elif name == "menu" -%}
    <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
  {%- endif -%}
</svg>
{%- endmacro %}
